name: Build APK J2 Core

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear proyecto completo
        run: |
          mkdir -p app/src/main/java/com/fxsound/lite
          mkdir -p .gradle
          cat > settings.gradle <<EOF
          include ':app'
          EOF
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF
          cat > gradle.properties <<EOF
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.fxsound.lite'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fxsound.lite"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-J2Core"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FxSound Lite" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/fxsound/lite/MainActivity.java <<EOF
          package com.fxsound.lite;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("FxSound Lite J2 Core - OK");
                  tv.setTextSize(20);
                  tv.setPadding(50, 300, 50, 50);
                  setContentView(tv);
              }
          }
          EOF
          ls -R

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-J2Core-LISTO
          path: app/build/outputs/apk/debug/app-debug.apk
