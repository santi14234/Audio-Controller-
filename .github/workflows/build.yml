name: Build APK J2 Core
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear proyecto que SI compila
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/fxsound/lite
          cat > settings.gradle << 'ENDOFFILE'
          include ':app'
          ENDOFFILE
          cat > build.gradle << 'ENDOFFILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDOFFILE
          cat > gradle.properties << 'ENDOFFILE'
          android.useAndroidX=true
          ENDOFFILE
          cat > app/build.gradle << 'ENDOFFILE'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.fxsound.lite'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fxsound.lite"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FxSound Lite" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/fxsound/lite/MainActivity.java << 'ENDOFFILE'
          package com.fxsound.lite;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("FxSound Lite J2 Core OK");
                  tv.setPadding(40,200,40,40);
                  tv.setTextSize(20);
                  setContentView(tv);
              }
          }
          ENDOFFILE

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-J2Core-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
