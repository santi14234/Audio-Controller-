name: Build APK J2 Core
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear proyecto
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/fxsound/lite
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "apply plugin: 'com.android.application'
          android {
              namespace 'com.fxsound.lite'
              compileSdk 34
              defaultConfig {
                  applicationId \"com.fxsound.lite\"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName \"1.0\"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }" > app/build.gradle
          mkdir -p app/src/main
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="FxSound" android:theme="@android:style/Theme.Material.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.fxsound.lite; import android.os.Bundle; import android.widget.SeekBar; import android.widget.TextView; import android.widget.LinearLayout; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); LinearLayout l=new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(30,100,30,30); TextView t=new TextView(this); t.setText("FxSound Lite - 3 Bandas OK"); t.setTextSize(22); l.addView(t); String[] b={"Graves","Medios","Agudos"}; for(String s:b){TextView tv=new TextView(this); tv.setText(s); l.addView(tv); SeekBar sb=new SeekBar(this); sb.setMax(100); sb.setProgress(50); l.addView(sb);} setContentView(l); } }' > app/src/main/java/com/fxsound/lite/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle wrapper --gradle-version 8.5 && chmod +x gradlew &&./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-3Bandas
          path: app/build/outputs/apk/debug/app-debug.apk
